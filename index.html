<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>計算トレーニングアプリ v3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        
        <nav class="tab-nav">
            <button id="tab-play-btn" class="tab-btn active">問題に挑戦</button>
            <button id="tab-record-btn" class="tab-btn">過去の記録</button>
        </nav>

        <section id="play-section" class="tab-content active">
            
            <div id="setup-view" class="card">
                <h2>トレーニング設定</h2>
                <div class="input-group">
                    <label for="op-select">演算の種類</label>
                    <select id="op-select">
                        <option value="+">足し算 (+)</option>
                        <option value="-">引き算 (-)</option>
                        <option value="*">掛け算 (×)</option>
                        <option value="/">割り算 (÷)</option>
                        <option value="rand-pm">足し算・引き算（ランダム）</option>
                        <option value="rand-md">掛け算・割り算（ランダム）</option>
                        <option value="rand-all">四則演算すべて（ランダム）</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="range-select">数値の範囲</label>
                    <select id="range-select">
                        <option value="positive">正の数のみ（回答も正）</option>
                        <option value="all">正負の数両方</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="count-select">出題数</label>
                    <select id="count-select">
                        <option value="10">10問</option>
                        <option value="20" selected>20問</option>
                        <option value="30">30問</option>
                        <option value="50">50問</option>
                    </select>
                </div>
                <button id="start-btn" class="primary-btn">スタート</button>
            </div>

            <div id="countdown-view" class="card hidden">
                <div id="countdown-number">3</div>
            </div>

            <div id="game-view" class="hidden">
                <div class="formula-card" id="formula-card-element">
                    <div class="game-header">
                        <span id="progress-display">第 1 / 20 問</span>
                        <span id="timer-display">00:00</span>
                    </div>
                    
                    <div class="formula-area">
                        <span id="formula-text">0 + 0 = </span>
                        <div class="answer-box" id="answer-input-box"></div>
                    </div>
                    
                    <div id="feedback-text" class="hidden"></div>
                </div>

                <div class="fixed-tenkey">
                    <div class="tenkey-grid">
                        <button class="key-btn" data-val="1">1</button>
                        <button class="key-btn" data-val="2">2</button>
                        <button class="key-btn" data-val="3">3</button>
                        <button class="key-btn" data-val="4">4</button>
                        <button class="key-btn" data-val="5">5</button>
                        <button class="key-btn" data-val="6">6</button>
                        <button class="key-btn" data-val="7">7</button>
                        <button class="key-btn" data-val="8">8</button>
                        <button class="key-btn" data-val="9">9</button>
                        <button class="key-btn action" data-val="-">負 (-)</button>
                        <button class="key-btn" data-val="0">0</button>
                        <button class="key-btn action" data-val="clear">C</button>
                        <button class="key-btn enter" id="enter-btn">決定</button>
                    </div>
                </div>
            </div>

            <div id="result-view" class="card hidden">
                <h2>結果発表 🎉</h2>
                <div class="result-stats">
                    <p>総経過時間: <strong id="res-total-time">0分0秒</strong></p>
                    <p>誤答数: <strong id="res-wrong-count">0回</strong></p>
                    <p>1問あたりの平均速度: <strong id="res-avg-speed">0.00秒</strong></p>
                </div>
                <button id="back-setup-btn" class="primary-btn">もう一度解く</button>
            </div>
            
        </section>

        <section id="record-section" class="tab-content">
            <div class="card scrollable-card">
                <h2>過去のデータとグラフ</h2>
                
                <div class="filter-panel">
                    <div class="input-group">
                        <label for="filter-op">演算</label>
                        <select id="filter-op">
                            <option value="+">足し算 (+)</option>
                            <option value="-">引き算 (-)</option>
                            <option value="*">掛け算 (×)</option>
                            <option value="/">割り算 (÷)</option>
                            <option value="rand-pm">足し算・引き算</option>
                            <option value="rand-md">掛け算・割り算</option>
                            <option value="rand-all">四則演算すべて</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="filter-range">範囲</label>
                        <select id="filter-range">
                            <option value="positive">正の数のみ</option>
                            <option value="all">正負の数両方</option>
                        </select>
                    </div>
                </div>

                <div class="input-group row-group">
                    <label for="graph-limit">表示件数:</label>
                    <select id="graph-limit">
                        <option value="10">最新10件</option>
                        <option value="20" selected>最新20件</option>
                        <option value="30">最新30件</option>
                        <option value="all">全件</option>
                    </select>
                    <button id="clear-data-btn" class="danger-btn">データを全消去</button>
                </div>

                <div class="chart-container">
                    <canvas id="record-chart"></canvas>
                </div>

                <h3>選択モードの履歴（最新順）</h3>
                <div class="history-list-wrapper">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>日時</th>
                                <th>問題数</th>
                                <th>誤答</th>
                                <th>1問平均</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>
    <script src="script.js"></script>
</body>
</html>
